<style>
:root{--font:Georgia,'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;--lack:#15181d;--lack2:#1e232b;--elfen:#f1eee6;--soft:#a9a79f;--messing:#c8a24f;--rot:#d36a5e;--ok:#7fbf8e}
*{box-sizing:border-box}
body{margin:0;background:var(--lack);color:var(--elfen);font:18px/1.7 var(--font)}
.keys{height:46px;background:
 linear-gradient(90deg,transparent 0px 15px,#0d0f13 15px 29px,transparent 29px 37px,#0d0f13 37px 51px,transparent 51px 81px,#0d0f13 81px 95px,transparent 95px 103px,#0d0f13 103px 117px,transparent 117px 125px,#0d0f13 125px 139px,transparent 139px) 0 0/154px 62% repeat-x,
 repeating-linear-gradient(90deg,transparent 0 21px,#b9b4a6 21px 22px),
 linear-gradient(180deg,#fbf9f3,var(--elfen));
 box-shadow:inset 0 -5px 8px rgba(0,0,0,.14)}
.keys i{position:absolute}
.keys-wrap{position:relative}
.keys-wrap b{position:absolute;top:0;width:24px;height:21px;background:var(--lack);border-radius:0 0 3px 3px}
header{max-width:760px;margin:0 auto;padding:40px 22px 10px}
h1,article h2{font-weight:600}
h1{font-size:clamp(34px,7vw,56px);line-height:1.1;margin:0 0 8px;font-weight:400;letter-spacing:-.5px}
.sub{color:var(--soft);margin:0}
.authorrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;margin-top:10px}
.authorrow .author{margin:0}
.author{margin:10px 0 0;font-size:20px;font-style:italic;color:var(--messing)}
main{max-width:760px;margin:0 auto;padding:10px 22px 80px}
.bar{display:flex;flex-direction:column;gap:8px;padding:12px 22px 0;max-width:760px;margin:0 auto}
.nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:max-content;max-width:100%;gap:8px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#conn:empty{display:none}
.bigbtn{min-height:44px;font-size:15px;padding:8px 18px}
.navbtn{min-width:0;min-height:32px;padding:3px 9px;font-size:12px;line-height:1.3;border-radius:7px;white-space:nowrap}
.navbtn .jp{font-size:11px;color:var(--soft)}
@media(max-width:350px){.navbtn{padding:3px 6px}.navbtn .jp{font-size:10px}}
.adminbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-start;align-items:center}
button,.btn{font:15px var(--font);background:transparent;color:var(--elfen);border:1px solid #444b57;padding:10px 16px;border-radius:6px;cursor:pointer;min-height:42px}
button:hover{border-color:var(--messing)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--messing);outline-offset:2px}
button.primary{background:var(--messing);color:#1a1405;border-color:var(--messing);font-weight:700}
button.danger{color:var(--rot);border-color:#6b3a35}
article{padding:34px 0;border-bottom:1px solid #2b313b}
article h2{font-size:30px;line-height:1.25;margin:0 0 4px;font-weight:400}
.date{color:var(--messing);font-size:14px;margin-bottom:14px}
.text{white-space:pre-wrap;word-wrap:break-word}
.imgs{display:grid;gap:10px;margin:18px 0;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.ph{height:140px;border-radius:4px;background:linear-gradient(90deg,#1e232b,#2a303a,#1e232b);background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
.mini{font-size:13px;min-height:0;padding:5px 10px}
.hp{position:absolute;left:-9999px;height:0;width:0;opacity:0}
.msgitem{border-top:1px solid #333a46;padding:12px 0}
.msgitem .who{color:var(--messing);font-size:14px;word-break:break-all}
.about-photo{width:min(100%,300px);border-radius:6px;float:left;margin:4px 22px 12px 0}
@media(max-width:520px){.about-photo{float:none;display:block;margin:0 0 14px}}
.imgs img{width:100%;border-radius:4px;display:block;cursor:zoom-in}
.admin-actions{margin-top:14px;display:flex;gap:8px}
.msg{color:var(--soft);padding:40px 0;text-align:center}
.panel{background:var(--lack2);border:1px solid #333a46;border-radius:10px;padding:20px;margin:24px 0}
.panel h3{margin:0 0 14px;font-weight:400;font-size:22px}
label{display:block;font-size:14px;color:var(--soft);margin:12px 0 4px}
input[type=text],input[type=password],textarea{width:100%;font:17px var(--font);background:var(--lack);color:var(--elfen);border:1px solid #444b57;border-radius:6px;padding:10px 12px}
textarea{min-height:200px;resize:vertical}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.thumb{position:relative;width:96px;height:96px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:4px}
.thumb button{position:absolute;top:-8px;right:-8px;min-height:28px;width:28px;padding:0;border-radius:50%;background:var(--lack);color:var(--rot);border-color:var(--rot)}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.note{font-size:14px;color:var(--soft)}
.note.ok{color:var(--ok)}.note.err{color:var(--rot)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px;z-index:9;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%}
footer{text-align:center;color:var(--soft);font-size:13px;padding:0 0 40px}
</style>
</head>
<body>
<div class="keys-wrap"><div class="keys"></div></div>
<div class="bar">
  <div class="toprow"><div class="nav"><button id="aboutBtn" class="navbtn">Über mich <span class="jp">プロフィール</span></button><button id="contactBtn" class="navbtn">Kontakt <span class="jp">お問い合わせ</span></button></div><button id="logoutTop" class="navbtn" style="display:none">Abmelden</button></div>
  <div class="adminbar"><span id="conn" class="note"></span><button id="inboxBtn" class="bigbtn" style="display:none">Nachrichten</button><button id="adminBtn" class="bigbtn" style="display:none">Verwalten</button></div>
</div>
<header>
  <h1 id="siteTitle">Klavier – Blog</h1>
  <p class="sub" id="siteSub">Gedanken, Konzerte und Eindrücke am Flügel.</p>
  <p class="author">Kyoko Yabuta</p>
</header>
<main>
  <section id="contact" class="panel" style="display:none">
    <h3>Kontakt / お問い合わせ</h3>
    <label for="cName">Name / お名前</label>
    <input type="text" id="cName" maxlength="100" autocomplete="name">
    <label for="cEmail">Deine E-Mail-Adresse / メールアドレス</label>
    <input type="text" id="cEmail" maxlength="200" autocomplete="email" inputmode="email">
    <label for="cText">Nachricht / メッセージ</label>
    <textarea id="cText" maxlength="4000" style="min-height:150px"></textarea>
    <input type="text" id="cHp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="row"><button class="primary" id="cSend">Nachricht senden / 送信</button><button id="cCancel">Schließen / 閉じる</button><span id="cMsg" class="note"></span></div>
  </section>
  <section id="about" class="panel" style="display:none">
    <div id="aboutView"></div>
    <div id="aViewRow" class="row"><button id="aEditBtn" class="mini" style="display:none">Bearbeiten / 編集</button><button id="aClose" class="mini">Schließen / 閉じる</button></div>
    <div id="aboutEdit" style="display:none">
      <label for="aTitle">Überschrift / 見出し</label>
      <input type="text" id="aTitle" maxlength="140">
      <label for="aText">Text / 本文</label>
      <textarea id="aText" style="min-height:220px"></textarea>
      <label for="aFile">Foto / 写真</label>
      <input type="file" id="aFile" accept="image/*">
      <div class="thumbs" id="aThumb"></div>
      <div class="row"><button class="primary" id="aSave">Speichern / 保存</button><button id="aCancel">Abbrechen / キャンセル</button><span id="aMsg" class="note"></span></div>
    </div>
  </section>
  <section id="inbox" class="panel" style="display:none">
    <h3>Nachrichten</h3>
    <div id="inboxList"></div>
  </section>
  <section id="editor" class="panel" style="display:none">
    <h3 id="editorTitle">Neuer Beitrag</h3>
    <label for="pTitle">Titel</label>
    <input type="text" id="pTitle" maxlength="140">
    <label for="pText">Text</label>
    <textarea id="pText"></textarea>
    <label for="pFiles">Bilder hinzufügen (werden automatisch komprimiert)</label>
    <input type="file" id="pFiles" accept="image/*" multiple>
    <div class="thumbs" id="thumbs"></div>
    <div class="row">
      <button class="primary" id="saveBtn">Veröffentlichen</button>
      <button id="cancelBtn">Abbrechen</button>
      <button id="logoutBtn">Abmelden</button>
      <span id="editMsg" class="note"></span>
    </div>
  </section>
  <div id="posts"><div class="msg">Beiträge werden geladen …</div></div>
</main>
<footer>© <span id="yr"></span></footer>
<div id="lightbox"><img alt=""></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const _c = "eyJhcGlLZXkiOiJjU0VCcHpYQkt5VTZOUm9xb1NpdUE4dUZJc2dRWEZKSnNNNWp1QnJjIiwiYXV0aERvbWFpbiI6Im11c2lrbm90ZW5hdXN0YXVzY2guZmlyZWJhc2VhcHAuY29tIiwiZGF0YWJhc2VVUkwiOiJodHRwczovL211c2lrbm90ZW5hdXN0YXVzY2gtZGVmYXVsdC1ydGRiLmV1cm9wZS13ZXN0MS5maXJlYmFzZWRhdGFiYXNlLmFwcCIsInByb2plY3RJZCI6Im11c2lrbm90ZW5hdXN0YXVzY2gifQ==";
const _p = "UGlub01hbw==";
const firebaseConfig = JSON.parse(atob(_c));
const PASSWORD = atob(_p);
const BLOG_PATH = "blog/posts";   // Pfad in der Realtime Database
const MAX_IMAGES = 6, MAX_SIDE = 1600, TARGET_KB = 260;

const $ = id => document.getElementById(id);
let db, posts = {}, admin = false, editId = null, images = [];

try { admin = sessionStorage.getItem('blogAdmin') === '1'; } catch(e){}
$('yr').textContent = new Date().getFullYear();

const esc = s => String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ts => new Date(ts).toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});

const PAGE = 8;
let limit = PAGE, imgCache = {}, loaded = 0, unsub = null;

function imgsOf(id){
  const p = posts[id];
  if(p.images) return Object.values(p.images).map(x=>({t:x,f:x}));   // ältere Beiträge
  return imgCache[id] || null;                                        // null = lädt noch
}

/* Vorschau zuerst; nach 2 s Sichtbarkeit wird das große Bild nachgeladen */
const dwell = new Map();
const io = window.IntersectionObserver ? new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    const img = en.target;
    if(en.isIntersecting){
      if(!dwell.has(img)) dwell.set(img, setTimeout(()=>{ dwell.delete(img); upgrade(img); }, 2000));
    }else if(dwell.has(img)){ clearTimeout(dwell.get(img)); dwell.delete(img); }
  });
},{threshold:0.6}) : null;
function observeImgs(){
  if(!io) return;
  io.disconnect(); dwell.forEach(t=>clearTimeout(t)); dwell.clear();
  document.querySelectorAll('#posts img[data-p]').forEach(img=>io.observe(img));
}
function fullOf(id, i){
  const x = (imgsOf(id)||[])[i]; if(!x) return Promise.resolve(null);
  if(x.f) return Promise.resolve(x.f);
  if(!x.loading) x.loading = db.ref('blog/images/'+id+'/'+i+'/f').once('value').then(s=>(x.f = s.val() || x.t)).catch(()=>x.t);
  return x.loading;
}
async function upgrade(img){
  const f = await fullOf(img.dataset.p, +img.dataset.i);
  if(f && img.isConnected && img.src !== f){ const pre = new Image(); pre.onload = ()=>{ img.src = f; }; pre.src = f; }
}

function render(){
  const ids = Object.keys(posts).sort((a,b)=>posts[b].createdAt-posts[a].createdAt);
  if(!ids.length){ $('posts').innerHTML = '<div class="msg">Noch keine Beiträge veröffentlicht.</div>'; return; }
  $('posts').innerHTML = ids.map(id=>{
    const p = posts[id], n = p.imgCount || (p.images ? Object.keys(p.images).length : 0), im = n ? imgsOf(id) : [];
    let grid = '';
    if(n && !im) grid = `<div class="imgs">${'<div class="ph"></div>'.repeat(Math.min(n,3))}</div>`;
    else if(im && im.length) grid = `<div class="imgs">${im.map((x,i)=>!x.t?'':`<img src="${x.f||x.t}" data-p="${id}" data-i="${i}" alt="Bild zu „${esc(p.title)}“">`).join('')}</div>`;
    return `<article>
      <h2>${esc(p.title)}</h2>
      <div class="date">${fmt(p.createdAt)}</div>
      <div class="text">${esc(p.text)}</div>${grid}
      ${admin?`<div class="admin-actions"><button data-edit="${id}">Bearbeiten</button><button class="danger" data-del="${id}">Löschen</button></div>`:''}
    </article>`;
  }).join('') + (loaded>=limit ? '<div class="msg"><button id="moreBtn">Ältere Beiträge laden</button></div>' : '');
  // Bilder erst nach dem Text nachladen
  ids.forEach(id=>{
    const p = posts[id];
    if(p.imgCount && !p.images && !(id in imgCache)){
      imgCache[id] = undefined;
      // nur die kleinen Vorschaubilder laden (…/t), die großen (…/f) erst bei Bedarf
      Promise.all(Array.from({length:p.imgCount}, (_,i)=>db.ref('blog/images/'+id+'/'+i+'/t').once('value').then(sn=>({t:sn.val()}))))
        .then(list=>{ imgCache[id] = list; render(); })
        .catch(()=>{ imgCache[id] = []; });
    }
  });
  observeImgs();
}

$('posts').addEventListener('click', e=>{
  const t = e.target;
  if(t.id==='moreBtn'){ limit += PAGE; listen(); return; }
  if(t.tagName==='IMG' && t.dataset.p){
    const pid = t.dataset.p, ix = +t.dataset.i, x = imgsOf(pid)[ix];
    $('lightbox').firstElementChild.src = x.f || x.t; $('lightbox').style.display='flex';
    if(!x.f) fullOf(pid, ix).then(f=>{ if(f && $('lightbox').style.display==='flex') $('lightbox').firstElementChild.src = f; });
  }
  if(t.dataset.edit) openEditor(t.dataset.edit);
  if(t.dataset.del && confirm('Diesen Beitrag endgültig löschen?')){
    db.ref().update({[BLOG_PATH+'/'+t.dataset.del]:null, ['blog/images/'+t.dataset.del]:null})
      .catch(err=>alert('Löschen fehlgeschlagen: '+err.message));
  }
});
$('lightbox').onclick = ()=> $('lightbox').style.display='none';

function adminUI(on){
  $('logoutTop').style.display = on ? '' : 'none';
  $('contactBtn').style.display = on ? 'none' : '';
  $('aboutBtn').innerHTML = on ? 'Profil bearbeiten' : 'Über mich <span class="jp">プロフィール</span>';
  if(on) $('contact').style.display = 'none';
}
function setAdmin(on){
  admin = on;
  try{ sessionStorage.setItem('blogAdmin', on?'1':'0'); }catch(e){}
  $('adminBtn').textContent = on ? 'Neuer Beitrag' : 'Verwalten';
  $('adminBtn').style.display = on ? '' : 'none';
  $('inboxBtn').style.display = on ? '' : 'none';
  $('logoutTop').style.display = on ? '' : 'none';
  if(!on){ $('editor').style.display='none'; $('inbox').style.display='none'; }
  adminMessages(on);
  adminUI(on);
  renderAbout(); if(!on) aboutView();
  render();
}

$('adminBtn').onclick = ()=>{
  if(!admin){
    const pw = prompt('Passwort eingeben:');
    if(pw===null) return;
    if(pw!==PASSWORD){ alert('Falsches Passwort.'); return; }
    setAdmin(true);
  }
  openEditor(null);
};
$('logoutBtn').onclick = ()=> setAdmin(false);
$('logoutTop').onclick = ()=> setAdmin(false);
$('cancelBtn').onclick = ()=> $('editor').style.display='none';

async function openEditor(id){
  editId = id;
  const p = id ? posts[id] : null;
  $('editorTitle').textContent = p ? 'Beitrag bearbeiten' : 'Neuer Beitrag';
  $('saveBtn').textContent = p ? 'Änderungen speichern' : 'Veröffentlichen';
  $('pTitle').value = p ? p.title : '';
  $('pText').value = p ? p.text : '';
  $('pFiles').value = '';
  $('editMsg').textContent = ''; $('editMsg').className='note';
  images = [];
  if(p){
    if(p.images) images = Object.values(p.images).map(x=>({t:x,f:x}));
    else if(p.imgCount){
      $('editMsg').textContent = 'Bilder werden geladen …';
      try{ images = Object.values((await db.ref('blog/images/'+id).once('value')).val()||{}); }catch(e){}
      $('editMsg').textContent = '';
    }
  }
  drawThumbs();
  $('editor').style.display='block';
  $('editor').scrollIntoView({behavior:'smooth',block:'start'});
}

function drawThumbs(){
  $('thumbs').innerHTML = images.map((x,i)=>`<div class="thumb"><img src="${x.t}" alt=""><button data-rm="${i}" aria-label="Bild entfernen">×</button></div>`).join('');
}
$('thumbs').addEventListener('click', e=>{
  if(e.target.dataset.rm!==undefined){ images.splice(+e.target.dataset.rm,1); drawThumbs(); }
});

function draw(img, side, q0, targetKB, minQ){
  const k = Math.min(1, side/Math.max(img.width,img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height);
  x.imageSmoothingQuality = 'high';
  x.drawImage(img,0,0,c.width,c.height);
  let q = q0, out = c.toDataURL('image/jpeg',q);
  while(out.length*0.75/1024 > targetKB && q > minQ){ q -= 0.06; out = c.toDataURL('image/jpeg',q); }
  return out;
}

function shrink(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onerror = ()=>rej(new Error('Datei nicht lesbar'));
    r.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>rej(new Error('Kein gültiges Bild: '+file.name));
      img.onload = ()=> res({ f: draw(img, MAX_SIDE, 0.86, TARGET_KB, 0.62), t: draw(img, 560, 0.74, 45, 0.5) });
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

$('pFiles').onchange = async e=>{
  const msg = $('editMsg'); msg.className='note';
  for(const f of e.target.files){
    if(images.length>=MAX_IMAGES){ msg.textContent='Maximal '+MAX_IMAGES+' Bilder pro Beitrag.'; msg.className='note err'; break; }
    try{ msg.textContent='Bild wird komprimiert …'; images.push(await shrink(f)); msg.textContent=''; }
    catch(err){ msg.textContent=err.message; msg.className='note err'; }
  }
  e.target.value=''; drawThumbs();
};

$('saveBtn').onclick = ()=>{
  const title = $('pTitle').value.trim(), text = $('pText').value.trim(), msg = $('editMsg');
  if(!title || !text){ msg.textContent='Bitte Titel und Text ausfüllen.'; msg.className='note err'; return; }
  const now = Date.now();
  const id = editId || db.ref(BLOG_PATH).push().key;
  const old = editId ? posts[editId] : null;
  const post = {title, text, imgCount: images.length, createdAt: old ? old.createdAt : now, updatedAt: now};
  msg.textContent='Wird gespeichert …'; msg.className='note';
  db.ref().update({
    [BLOG_PATH+'/'+id]: post,
    ['blog/images/'+id]: images.length ? images : null
  }).then(()=>{ delete imgCache[id]; $('editor').style.display='none'; })
    .catch(err=>{ msg.textContent='Speichern fehlgeschlagen: '+err.message; msg.className='note err'; });
};

$('contactBtn').onclick = ()=>{
  const c = $('contact'), open = c.style.display!=='block';
  c.style.display = open ? 'block' : 'none';
  if(open){ $('cName').focus(); c.scrollIntoView({behavior:'smooth',block:'start'}); }
};
function tryPw(){
  if($('cName').value.trim() !== PASSWORD) return false;
  $('cName').value=''; $('cMsg').textContent=''; $('contact').style.display='none';
  setAdmin(true);
  return true;
}
$('cName').addEventListener('input', tryPw);
$('cCancel').onclick = ()=> $('contact').style.display='none';
$('cSend').onclick = ()=>{
  const m=$('cMsg'), name=$('cName').value.trim(), email=$('cEmail').value.trim(), text=$('cText').value.trim();
  m.className='note err';
  if($('cHp').value) return;
  if(tryPw()) return;
  if(!name || !text){ m.textContent='Bitte Name und Nachricht ausfüllen. / お名前とメッセージを入力してください。'; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ m.textContent='Bitte eine gültige E-Mail-Adresse angeben. / 有効なメールアドレスを入力してください。'; return; }
  try{ if(Date.now()-(+localStorage.getItem('lastMsg')||0) < 30000){ m.textContent='Bitte einen Moment warten. / 少々お待ちください。'; return; } }catch(e){}
  m.className='note'; m.textContent='Wird gesendet … / 送信中…'; $('cSend').disabled=true;
  db.ref('blog/messages').push({name:name.slice(0,100), email:email.slice(0,200), text:text.slice(0,4000), createdAt:Date.now()})
    .then(()=>{
      try{ localStorage.setItem('lastMsg', Date.now()); }catch(e){}
      $('cName').value=''; $('cEmail').value=''; $('cText').value='';
      m.className='note ok'; m.textContent='Danke! Deine Nachricht wurde gesendet. / ありがとうございます。送信しました。';
    })
    .catch(()=>{ m.className='note err'; m.textContent='Senden fehlgeschlagen. Bitte später erneut versuchen. / 送信に失敗しました。後でもう一度お試しください。'; })
    .finally(()=>{ $('cSend').disabled=false; });
};

let msgRef = null, msgs = {};
function adminMessages(on){
  if(msgRef){ msgRef.off(); msgRef = null; }
  msgs = {};
  if(!on) return;
  msgRef = db.ref('blog/messages');
  msgRef.on('value', v=>{ msgs = v.val()||{}; renderInbox(); },
    err=>{ $('inboxList').innerHTML = '<div class="note err">Nachrichten konnten nicht geladen werden: '+esc(err.message)+'</div>'; });
}
function renderInbox(){
  const ids = Object.keys(msgs).sort((a,b)=>msgs[b].createdAt-msgs[a].createdAt);
  $('inboxBtn').textContent = 'Nachrichten' + (ids.length ? ' ('+ids.length+')' : '');
  $('inboxList').innerHTML = ids.length ? ids.map(id=>{
    const m = msgs[id];
    return `<div class="msgitem"><div class="who">${esc(m.name)} · <a href="mailto:${esc(m.email)}" style="color:inherit">${esc(m.email)}</a> · ${new Date(m.createdAt).toLocaleString('de-DE')}</div>
      <div class="text">${esc(m.text)}</div>
      <div class="admin-actions"><button class="danger mini" data-mdel="${id}">Löschen</button></div></div>`;
  }).join('') : '<div class="note">Noch keine Nachrichten.</div>';
}
$('inboxList').addEventListener('click', e=>{
  const id = e.target.dataset.mdel;
  if(id && confirm('Nachricht endgültig löschen?')) db.ref('blog/messages/'+id).remove();
});
$('inboxBtn').onclick = ()=>{ const b=$('inbox'); b.style.display = b.style.display==='block' ? 'none' : 'block'; };

/* ---------- Über mich ---------- */
let aboutData = null, aboutPhoto = null;
function renderAbout(){
  const a = aboutData;
  $('aboutView').innerHTML = a
    ? (a.photo ? `<img class="about-photo" src="${a.photo}" alt="Foto von Kyoko Yabuta">` : '')
      + (a.title ? `<h2 style="margin:0 0 8px;font-weight:400">${esc(a.title)}</h2>` : '')
      + `<div class="text">${esc(a.text)}</div><div style="clear:both"></div>`
    : '<div class="note">Noch kein Beitrag vorhanden. / まだ投稿がありません。</div>';
  $('aEditBtn').style.display = admin ? '' : 'none';
}
function aboutView(){ $('aboutEdit').style.display='none'; $('aboutView').style.display=''; $('aViewRow').style.display=''; }
async function loadAbout(){
  try{ aboutData = (await db.ref('blog/about').once('value')).val(); }
  catch(e){ $('aboutView').innerHTML = '<div class="note err">Konnte nicht geladen werden: '+esc(e.message)+'</div>'; return; }
  renderAbout();
}
$('aboutBtn').onclick = ()=>{
  const p = $('about'), open = p.style.display!=='block';
  p.style.display = open ? 'block' : 'none';
  if(open){ aboutView(); loadAbout().then(()=>{ if(admin) $('aEditBtn').click(); }); p.scrollIntoView({behavior:'smooth',block:'start'}); }
};
$('aClose').onclick = ()=> $('about').style.display='none';
function drawAboutThumb(){
  $('aThumb').innerHTML = aboutPhoto ? `<div class="thumb"><img src="${aboutPhoto}" alt=""><button data-arm="1" aria-label="Foto entfernen">×</button></div>` : '';
}
$('aThumb').addEventListener('click', e=>{ if(e.target.dataset.arm){ aboutPhoto = null; drawAboutThumb(); } });
$('aEditBtn').onclick = ()=>{
  $('aTitle').value = (aboutData && aboutData.title) || '';
  $('aText').value = (aboutData && aboutData.text) || '';
  aboutPhoto = (aboutData && aboutData.photo) || null;
  $('aFile').value = ''; $('aMsg').textContent = ''; drawAboutThumb();
  $('aboutView').style.display='none'; $('aViewRow').style.display='none'; $('aboutEdit').style.display='block';
};
$('aCancel').onclick = aboutView;
$('aFile').onchange = async e=>{
  const f = e.target.files[0], m = $('aMsg'); if(!f) return;
  m.className = 'note'; m.textContent = 'Foto wird komprimiert …';
  try{ aboutPhoto = (await shrink(f)).f; m.textContent = ''; drawAboutThumb(); }
  catch(err){ m.className='note err'; m.textContent = err.message; }
  e.target.value = '';
};
$('aSave').onclick = ()=>{
  const m = $('aMsg'), text = $('aText').value.trim();
  if(!text){ m.className='note err'; m.textContent='Bitte einen Text eingeben.'; return; }
  const data = {title:$('aTitle').value.trim(), text, photo:aboutPhoto||null, updatedAt:Date.now()};
  m.className = 'note'; m.textContent = 'Wird gespeichert …';
  db.ref('blog/about').set(data)
    .then(()=>{ aboutData = data; aboutView(); renderAbout(); })
    .catch(err=>{ m.className='note err'; m.textContent='Speichern fehlgeschlagen: '+err.message; });
};

function listen(){
  if(unsub) unsub();
  const ref = db.ref(BLOG_PATH).orderByKey().limitToLast(limit);
  const cb = s=>{ posts = s.val()||{}; loaded = Object.keys(posts).length; render(); };
  ref.on('value', cb, err=>{ $('posts').innerHTML='<div class="msg">Beiträge konnten nicht geladen werden: '+esc(err.message)+'</div>'; });
  unsub = ()=>ref.off('value', cb);
}

try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  db.ref('.info/connected').on('value', s=>{
    $('conn').textContent = s.val() ? '' : 'keine Verbindung …';
  });
  listen();
  adminMessages(admin);
}catch(e){
  $('posts').innerHTML='<div class="msg">Firebase-Verbindung fehlgeschlagen: '+esc(e.message)+'</div>';
}
if(admin){ $('adminBtn').textContent='Neuer Beitrag'; $('adminBtn').style.display=''; $('logoutTop').style.display=''; $('inboxBtn').style.display=''; }
if(admin) adminUI(true);
</script>
</body>
</html>
